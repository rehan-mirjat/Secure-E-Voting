name: secure_e_voting
description: Secure e-voting system for academic elections using Flutter and Firebase.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase Suite
  firebase_core: ^3.12.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.4
  cloud_functions: ^5.3.3
  firebase_storage: ^12.4.3
  google_sign_in: ^6.2.2

  # State Management & Navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.0

  # Utilities & UI
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  fl_chart: ^0.70.2
  image_picker: ^1.1.2
  uuid: ^4.5.1
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_cloud_firestore: ^3.1.0
  firebase_auth_mocks: ^0.14.0
  flutter_launcher_icons: ^0.14.2

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
