pluginManagement {
    try {
        def pe = Class.forName("java.lang.ProcessEnvironment")
        try {
            def envField = pe.getDeclaredField("theEnvironment")
            envField.setAccessible(true)
            envField.get(null).keySet().removeIf { k -> k.toString() == "ANDROID_PREFS_ROOT" }
        } catch (ignored) {}
        try {
            def unmodField = pe.getDeclaredField("theUnmodifiableEnvironment")
            unmodField.setAccessible(true)
            unmodField.get(null).keySet().removeIf { k -> k.toString() == "ANDROID_PREFS_ROOT" }
        } catch (ignored) {}
    } catch (ignored) {}

    def flutterSdkPath = {
        def properties = new java.util.Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null : "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.11.1" apply false
    // START: FlutterFire Configuration
    id "com.google.gms.google-services" version "4.4.2" apply false
    // END: FlutterFire Configuration
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
}

include ":app"
